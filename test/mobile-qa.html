<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Local viewport QA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;padding:24px;background:#d9dee7;font:16px system-ui}iframe{display:block;border:1px solid #555;margin:auto;height:700px;background:white}p{text-align:center}</style>
</head><body><p id="label"></p><iframe title="小画面での会話ゲーム" src="/index.html"></iframe>
<script>
const params = new URLSearchParams(location.search);
const width = params.get('width') === '375' ? 375 : 320;
const font = params.get('font') === '200' ? 200 : 100;
const dark = params.get('theme') === 'dark';
const frame = document.querySelector('iframe');
frame.style.width = width + 'px';
document.querySelector('#label').textContent = `検証用 viewport: ${width}px / 文字サイズ: ${font}% / ${dark ? 'dark token override' : 'system theme'}`;
frame.onload = () => {
  const doc = frame.contentDocument;
  doc.documentElement.style.fontSize = font + '%';
  if (dark) {
    for (const sheet of doc.styleSheets) for (const rule of sheet.cssRules) {
      if (rule.type === CSSRule.MEDIA_RULE && rule.conditionText.includes('prefers-color-scheme: dark')) rule.media.mediaText = 'all';
    }
  }
};
</script></body></html>
